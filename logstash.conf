input {
  file {
    path => "/usr/share/logstash/data/snort/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => {
      "message" => '%{DATA:snort_time} \[\*\*\] \[%{INT:generator}:%{INT:sid}:%{INT:rev}\] "%{DATA:alert_msg}" \[\*\*\] \[Priority: %{INT:priority}\] \{%{WORD:protocol}\} %{IP:src_ip}:%{INT:src_port} -> %{IP:dst_ip}:%{INT:dst_port}'
    }
  }

  mutate {
    convert => {
      "sid" => "integer"
      "rev" => "integer"
      "priority" => "integer"
      "src_port" => "integer"
      "dst_port" => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "snort-alerts"
  }

  stdout {
    codec => rubydebug
  }
}